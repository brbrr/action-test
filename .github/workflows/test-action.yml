name: Action
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
  push:
    branches:
      - master # Every time a PR is merged to master.
  pull_request_target:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
        shell: bash

      - name: Get Job ID
        id: get_job_id
        run: |
          JOB_JSON=$(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          JOB_ID=$(echo $JOB_JSON | jq -r '.jobs[] | select(.name == "${{ github.job }}") | .id')
          echo "JOB_ID=$JOB_ID" >> $GITHUB_OUTPUT

      - name: test
        run: |
          echo "ref: &{{github.ref}}"
          echo "github: &{{ github }}"
            # if: github.ref == 'refs/heads/main' 
          # && (github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'cortex'))
